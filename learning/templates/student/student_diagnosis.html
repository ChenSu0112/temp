{% extends 'student/base.html' %}

{% block title %}学习诊断 - 在线学习诊断系统{% endblock %}

{% block content %}
<style>
    /* 只需要添加模型选择器的样式，其他保持原样 */
    .model-selection-section {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 25px;
        border-left: 4px solid #007bff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    /* 学生页面布局样式 - 与教师页面保持一致 */
    .student-container {
        display: flex;
        min-height: calc(100vh - 80px); /* 减去导航栏高度 */
        margin-top: 20px; /* 与导航栏的间距 */
    }

    /* 主内容区域 - 与教师页面保持一致 */
    .student-main-content {
        flex: 1;
        padding: 20px;
        min-height: 100%;
        background-color: #ffffff;
    }

    .sidebar-nav .nav-link i {
        width: 20px;
        text-align: center;
        margin-right: 10px;
    }

</style>


<!-- 右侧主内容区域 -->
<main class="student-main-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">学习诊断报告</h1>
    </div>

    <!-- 模型选择器 - 下拉选择版本 -->
    <div class="model-selection-section">
        <h5 class="mb-3">
            <i class="fas fa-cogs me-2"></i>选择诊断模型
        </h5>

        <form method="get" action="{% url 'student_diagnosis' %}" class="row g-3 align-items-end">
            <div class="col-md-8">
                <label for="modelSelect" class="form-label">选择分析模型</label>
                <select class="form-select" id="modelSelect" name="model_id" required>
                    <option value="">-- 请选择诊断模型 --</option>
                    {% for model in available_models %}
                    <option value="{{ model.id }}"
                            {% if selected_model.id == model.id %}selected{% endif %}>
                        {{ model.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-play-circle me-1"></i>开始分析
                </button>
            </div>

            {% if not available_models %}
            <div class="col-12">
                <div class="alert alert-warning mb-0">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    暂无可用诊断模型
                </div>
            </div>
            {% endif %}
        </form>
    </div>





</main>


{% endblock %}

<script>
    // 简单的脚本让点击整个标签都能选中radio
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.model-option').forEach(option => {
            option.addEventListener('click', function() {
                const radio = this.querySelector('input[type="radio"]');
                if (radio) {
                    radio.checked = true;
                    radio.closest('form').submit();
                }
            });
        });
    });
</script>
